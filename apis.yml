name: Soha Systems
description: >-
  Soha Systems was a cloud-delivered secure application access company founded in 2013 and
  headquartered in Sunnyvale, California. Its "Soha Cloud" service let enterprises grant
  users and third parties fast, secure, per-application access to internal apps without a
  traditional VPN, an early software-defined perimeter / zero-trust network access (ZTNA)
  approach. Backed by Andreessen Horowitz (a16z), Menlo Ventures, and Cervin Ventures, Soha
  Systems was acquired by Akamai Technologies in October 2016, and its technology became the
  basis for Akamai Enterprise Application Access (EAA). The company no longer operates
  independently and publishes no standalone developer portal, documentation, or public API;
  its former domain (soha.io) now resolves only to Akamai edge infrastructure and serves no
  content.
